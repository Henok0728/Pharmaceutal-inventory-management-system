spring.application.name=pharmacy-management-system
# Database Connection (configurable via environment variables for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.sql.init.continue-on-error=true

# Run schema.sql every time the app starts
spring.sql.init.mode=always

# Tell Hibernate not to mess with the tables we created manually
spring.jpa.hibernate.ddl-auto=none